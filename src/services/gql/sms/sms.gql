fragment CapturedSmsFields on CapturedSms {
  id
  sender
  body
  receivedAt
  status
  parsed
  suggestion
  account {
    id
    name
  }
}

query GetPendingSms($limit: Int) {
  CapturedSmsList(where: { status: { equals: pending } }, sort: "-receivedAt", limit: $limit) {
    docs {
      ...CapturedSmsFields
    }
    totalDocs
  }
}

query GetCapturedSms($id: String!) {
  CapturedSms(id: $id) {
    ...CapturedSmsFields
  }
}

mutation ConfirmCapturedSms($id: String!, $overrides: SmsConfirmOverrides) {
  confirmCapturedSms(id: $id, overrides: $overrides) {
    transaction
    linked
  }
}

mutation DismissCapturedSms($id: String!) {
  dismissCapturedSms(id: $id)
}

query GetAutoConfirmedSms($since: DateTime!) {
  CapturedSmsList(
    where: { autoConfirmed: { equals: true }, receivedAt: { greater_than_equal: $since } }
    sort: "-receivedAt"
    limit: 20
  ) {
    docs {
      id
      receivedAt
      parsed
      transaction {
        id
        title
        amount
        type
      }
    }
  }
}

mutation UndoAutoConfirmedSms($id: String!) {
  undoAutoConfirmedSms(id: $id)
}

query GetBalanceChecks {
  balanceChecks {
    account
    accountName
    bankBalance
    pikaBalance
    difference
    matched
    asOf
    sms
    lastMatchedAt
    firstOffAt
    pending
  }
}
